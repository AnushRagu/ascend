version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: ascend-db
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend_secret_password
      POSTGRES_DB: ascend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend -d ascend"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ascend-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ascend:ascend_secret_password@db:5432/ascend
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ascend-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
